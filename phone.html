<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Kamera</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; text-align:center; }
  video { width:100%; max-height:70vh; background:#000; }
  button { font-size:20px; padding:14px 22px; margin:10px; border:0; border-radius:10px; color:#fff; }
  #start { background:#2a7; }
  #rec { background:#c33; }
  #rec:disabled { background:#555; }
  #status { padding:10px; }
</style>
</head>
<body>
<video id="preview" autoplay muted playsinline></video>
<div id="status">Bereit</div>
<button id="start">Kamera starten</button>
<button id="rec" disabled>● Aufnehmen</button>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const ROOM = "meinplan-7342"; // Muss in mac.html identisch sein! Am besten einen eigenen, längeren Namen wählen.
const $ = id => document.getElementById(id);
let stream = null, peer = null, recorder = null, chunks = [];

$("start").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: 1280, height: 720 },
      audio: true
    });
  } catch (e) {
    $("status").textContent = "Kamera-Zugriff verweigert";
    return;
  }
  $("preview").srcObject = stream;
  $("start").disabled = true;
  $("rec").disabled = false;

  peer = new Peer(ROOM + "-phone");
  peer.on("open", () => $("status").textContent = "Bereit – Mac kann sich verbinden");
  peer.on("connection", conn => {
    peer.call(conn.peer, stream); // Live-Stream an den Mac schicken
    $("status").textContent = "Mac verbunden – streamt live";
  });
  peer.on("error", e => $("status").textContent = "Fehler: " + e.type);
};

$("rec").onclick = () => {
  if (!recorder) {
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: recorder.mimeType });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "video-" + Date.now() + ".webm";
      a.click();
      recorder = null;
    };
    recorder.start();
    $("rec").textContent = "■ Stopp";
  } else {
    recorder.stop();
    $("rec").textContent = "● Aufnehmen";
  }
};
</script>
</body>
</html>
